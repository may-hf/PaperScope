function showDetail(id){const p=store.papers.find(p=>p.id===id);if(!p)return;const d=$('#detail');d.classList.remove('hidden');d.innerHTML=`<div class="detailinner"><button class="back" id="backBtn">← 一覧に戻る</button><div class="muted" style="margin-top:25px">${esc(p.journal)} · ${esc(p.date)}</div><h1>${esc(p.title)}</h1><div class="chips">${(p.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><h2>筆頭著者</h2><p>${esc(p.firstAuthor)}<br>${esc(p.firstAffiliation)}</p><h2>Corresponding author</h2><p>${esc(p.corresponding)}</p><h2>研究内容</h2><p>${esc(p.summary)}</p><h2>新規性・重要点</h2><p>${esc(p.novelty)}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:28px 0"><a class="primary" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">論文ページを開く ↗</a><button class="secondary" id="askChatGPT">この論文についてChatGPTに質問 ↗</button><button class="secondary" id="readBtn">${store.read.includes(id)?'✓ 既読を解除':'✓ 既読にする'}</button><button class="secondary" id="detailSave">${store.saved.includes(id)?'★ 保存済み':'☆ 保存する'}</button></div><div class="notice">${p.source==='auto'?'自動収集した書誌情報です。本文の要約・責任著者情報は未検証です。':p.source==='enriched'?'取り込んだ要約です。研究利用の際は原典をご確認ください。':'収録済みのサンプルデータです。研究利用の際は原典をご確認ください。'}</div></div>`;d.scrollTop=0;$('#backBtn').onclick=()=>{d.classList.add('hidden');render()};$('#readBtn').onclick=()=>{setPaperState(id,'read');showDetail(id)};$('#detailSave').onclick=()=>{setPaperState(id,'saved');showDetail(id)};$('#askChatGPT').onclick=()=>{const prompt=['以下の論文について質問したいです。まず論文の情報を確認し、研究内容・新規性を理解したうえで、私の質問に答えてください。提供された要約だけでは分からない点は推測せず、必要に応じて原論文の確認を促してください。','','タイトル: '+p.title,'掲載誌: '+(p.journal||'未確認'),'DOI / ID: '+p.id,'論文URL: '+p.url,'研究内容: '+(p.summary||'未確認'),'新規性: '+(p.novelty||'未確認'),'','この論文について詳しく質問したいです。'].join('\\n');window.open('https://chatgpt.com/?q='+encodeURIComponent(prompt),'_blank','noopener,noreferrer')}}
async function syncFeed(manual=false){
  feedStatus='フィードを確認中…';if(manual)render();
  try{const response=await fetch('./papers.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('フィード未公開（HTTP '+response.status+'）');
    const data=await response.json();if(!data||!Array.isArray(data.papers))throw Error('JSON形式が正しくありません');
    const feedIds=new Set(data.papers.filter(p=>p&&typeof p.id==='string').map(p=>p.id.toLowerCase()));store.papers=store.papers.filter(p=>!sampleIds.includes(String(p.id).toLowerCase())||feedIds.has(String(p.id).toLowerCase()));
    let added=0;for(const p of data.papers){if(!p||typeof p.id!=='string'||typeof p.title!=='string'||!['Chemistry','Geometry'].includes(p.category)||typeof p.url!=='string'||!/^https:\/\//.test(p.url))continue;
      const existing=store.papers.find(x=>x.id.toLowerCase()===p.id.toLowerCase());if(existing){if(p.source==='enriched'){for(const field of ['summary','novelty','firstAuthor','firstAffiliation','corresponding','tags']){if(field==='tags'?Array.isArray(p[field]):typeof p[field]==='string'&&p[field].trim())existing[field]=p[field];}existing.source='enriched';}}else{store.papers.push({...p,source:p.source||'auto',tags:Array.isArray(p.tags)?p.tags:[],added:p.added||p.date||'1970-01-01'});added++}}
    save();lastFeedUpdate=data.updated||'';feedStatus=(added?added+'件の新着を追加 · ':'新着なし · ')+(lastFeedUpdate?'最終取得 '+lastFeedUpdate:'フィード取得済み');
  }catch(e){feedStatus='自動フィード未接続：'+e.message+'。再取得をお試しください。'}render();
}
