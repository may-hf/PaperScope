:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#152238;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#101c2c;color:#fff;padding:20px 20px 22px}header .top{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:auto}.logo{font-weight:800;font-size:21px;letter-spacing:-.6px}.sub{font-size:11px;opacity:.65;margin-top:3px}.today{font-size:12px;opacity:.8}.wrap{max-width:680px;margin:auto;padding:18px 16px 110px}.hero{display:flex;justify-content:space-between;align-items:end;margin:2px 0 20px}.hero h1{font-size:23px;margin:0 0 4px}.muted{color:#708094;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}.stat{background:#fff;border:1px solid #e8edf3;border-radius:15px;padding:15px}.stat strong{display:block;font-size:24px;margin-top:5px}.stat span{color:#788599;font-size:11px}.tabs{display:flex;gap:8px;margin-bottom:16px;overflow:auto}.pill{border:1px solid #dce4ee;border-radius:30px;padding:9px 15px;background:#fff;color:#536176;white-space:nowrap;font-size:12px}.pill.active{background:#192d45;color:white;border-color:#192d45}.paper{background:white;border:1px solid #e4eaf1;border-radius:17px;padding:17px;margin:0 0 12px;box-shadow:0 3px 12px #1b2e4505}.meta{font-size:11px;color:#748296;display:flex;justify-content:space-between;gap:12px}.paper h3{font-size:15px;line-height:1.5;margin:11px 0 8px}.paper p{font-size:12px;color:#65748a;line-height:1.65;margin:0 0 12px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10px;border-radius:7px;padding:5px 8px;background:#edf3f8;color:#526b82}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:15px;border-top:1px solid #f0f2f6;padding-top:12px}.linkbtn,.iconbtn{border:0;background:none;color:#355b81;font-weight:700;font-size:12px;padding:5px}.iconbtn{font-size:20px;color:#a1acbb}.iconbtn.saved{color:#d2943 </style></head><body><header><div class="top"><div><div class="logo">◈ PaperScope</div><div class="sub">YOUR DAILY RESEARCH DIGEST</div></div><div class="today" id="headerDate"></div></div></header><main class="wrap" id="app"></main><nav class="bottom" id="nav"></nav><div id="detail" class="detail hidden"></div><script>
const seed=[
{id:'10.1021/acs.chemmater.5c03181',title:'Facile Synthesis of Oxyhydrides by Reaction with NaBH₄ in an Open System',journal:'Chemistry of Materials',date:'2026-05-13',added:'2026-11-13',category:'Chemistry',tags:['Oxyhydride','Topochemical'],firstAuthor:'Megan E. Burrill',firstAffiliation:'Northwestern University',corresponding:'Sossina M. Haile — Northwestern University',summary:'NaBH₄を用い、Ar流通下の開放系でSrTiO₃へHを導入する合成法を検討。短時間の処理で低濃度の酸水素化物を得た。',novelty:'石英管封入を必要としない酸水素化物合成経路を提示。固体NMRなどでHの状態を評価。',url:'https://doi.org/10.1021/acs.chemmater.5c03181'},
{id:'10.1021/acs.chemmater.6c01445',title:'High-Purity Synthesis of Perovskite Oxynitride LaHfO₂N Prepared via a Reduced-Ammonolysis Treatment Using an Active Metal and Amorphous Oxide-Based Precursor',journal:'Chemistry of Materials',date:'2026-08-13',added:'2026-11-12',category:'Chemistry',tags:['Oxynitride','Perovskite'],firstAuthor:'Kazuya Sakinaga',firstAffiliation:'岡山理科大学',corresponding:'Yasushi Sato — 岡山理科大学',summary:'非晶質酸化物前駆体とMgまたはMgH₂を用いた還元的アンモノリシスによってLaHfO₂Nを合成。',novelty:'難合成酸窒化物の高純度合成に向け、前駆体の結晶性と還元剤量を調整した。',url:'https://doi.org/10.1021/acs.chemmater.6c01445'},
{id:'10.1021/jacs.6c06507',title:'Cation Coordination Preferences toward Stacking Design in Layered Perovskites along the Perovskite [111] Direction',journal:'Journal of the American Chemical Society',date:'2026-08-18',added:'2026-11-11',category:'Chemistry',tags:['Perovskite','Structure'],firstAuthor:'Teppei Nagase',firstAffiliation:'京都大学ほか',corresponding:'Takafumi Yamamoto — 京都大学ほか',summary:'カチオンの配位選好性を指針として、[111]方向に積層したペロブスカイト関連構造を設計。',novelty:'元素比やアニオン組成による配位環境の制御を、未知構造の合成指針に利用。',url:'https://doi.org/10.1021/jacs.6c06507'},
{id:'arxiv:2611.04246',title:'Polyominoes Folding into Four and Five Distinct Boxes',journal:'arXiv',date:'2026-11-03',added:'2026-11-13',category:'Geometry',tags:['Polyomino','Folding'],firstAuthor:'Erik D. Demaine',firstAffiliation:'MIT',corresponding:'未確認',summary:'一つのpolyominoから複数種類の直方体を折り畳める構成を探索。',novelty:'計算探索で見つけた例を改良し、5種類の直方体に折れるpolyominoの無限族を構成。',url:'https://arxiv.org/abs/2611.04246'},
{id:'arxiv:2611.12239',title:'Cube tilings, partition counters, and the Calkin–Wilf and Kepler trees',journal:'arXiv',date:'2026-11-09',added:'2026-11-12',category:'Geometry',tags:['Tiling','Graph Theory'],firstAuthor:'Jarosław Grytczuk',firstAffiliation:'未確認',corresponding:'未確認',summary:'離散的な立方体の敷き詰めと、分割数・数論的な樹形構造との関係を研究。',novelty:'幾何学的な局所分割の数え上げをCalkin–Wilf treeなどと関連づける。',url:'https://arxiv.org/abs/2611.12239'},
{id:'arxiv:2611.16730',title:'Metric random tilings: exact entropy and the diffraction of counted disorder',journal:'arXiv',date:'2026-11-12',added:'2026-11-14',category:'Geometry',tags:['Tiling','Patterns'],firstAuthor:'Xinyan Wu',firstAffiliation:'未確認',corresponding:'未確認',summary:'接続関係を固定したまま辺の長さを変化させるmetric random tilingのエントロピーを調べる。',novelty:'タイルの並べ方以外の幾何学的自由度に着目し、乱れと回折の関係を分析。',url:'https://arxiv.org/abs/2611.16730'}
];
const key='paperscope-v1';let store;try{store=JSON.parse(localStorage.getItem(key))||{papers:seed,read:[],saved:[]}}catch{store={papers:seed,read:[],saved:[]}};if(!Array.isArray(store.papers))store.papers=seed;if(!Array.isArray(store.read))store.read=[];if(!Array.isArray(store.saved))store.saved=[];let feedStatus='自動フィードを確認中…',lastFeedUpdate='';let page='home',filter='All',query='',libraryFilter='saved';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(store));const niceDate=s=>{const d=new Date(s+'T12:00:00');return isNaN(d)?s:new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric'}).format(d)};const sorted=()=>[...store.papers].sort((a,b)=>b.added.localeCompare(a.added)||a.title.localeCompare(b.title));const paperCard=p=>`<article class="paper"><div class="meta"><span>${esc(p.journal)} · ${esc(p.date)}</span><span>${store.read.includes(p.id)?'✓ 既読':'● 未読'}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="chips">${(p.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="actions"><button class="linkbtn" data-detail="${esc(p.id)}">詳しく読む →</button><button class="iconbtn ${store.saved.includes(p.id)?'saved':''}" data-save="${esc(p.id)}" aria-label="お気に入り">${store.saved.includes(p.id)?'★':'☆'}</button></div></article>`;const categoryTabs=()=>`<div class="tabs">${[['All','すべて'],['Chemistry','Chemistry'],['Geometry','Maze / Geometry']].map(([v,l])=>`<button class="pill ${filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div>`;const empty=txt=>`<div class="empty">${txt}</div>`;
function render(){const unread=store.papers.filter(p=>!store.read.includes(p.id)).length;$('#headerDate').textContent=new Intl.DateTimeFormat('ja-JP',{month:'short',day:'numeric'}).format(new Date());let html='';if(page==='home'){let all=sorted().filter(p=>filter==='All'||p.category===filter);let latest=all[0]?.added;html=`<div class="hero"><div><h1>今日の論文</h1></div></div><div class="muted">最終登録 ${latest?niceDate(latest):'—'}</div></div><div class="stats"><div class="stat"><span>未読</span><strong>${unread}</strong></div><div class="stat"><span>お気に入り</span><strong>${store.saved.length}</strong></div><div class="stat"><span>登録論文</span><strong>${store.papers.length}</strong></div></div><div class="settingsbox" style="padding:12px 15px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="muted" id="feedStatus">${esc(feedStatus)}</span><button class="secondary" id="refreshFeed">更新を確認</button></div></div>${categoryTabs()}${all.length?all.map(p=>paperCard(p)).join(''):empty('この分野の論文はまだありません。')}`}
if(page==='search'){let q=query.toLowerCase();let arr=sorted().filter(p=>[p.title,p.journal,p.firstAuthor,p.firstAffiliation,p.summary,...(p.tags||[])].join(' ').toLowerCase().includes(q));html=`<div class="hero"><div><h1>論文を探す</h1><div class="muted">タイトル・著者・キーワードで検索</div></div></div><input class="search" id="searchInput" placeholder="例：oxyhydride, tiling, JACS" value="${esc(query)}"><div id="searchResults">${arr.length?arr.map(p=>paperCard(p)).join(''):empty('一致する論文がありません。')}</div>`}
if(page==='library'){let arr=sorted().filter(p=>libraryFilter==='saved'?store.saved.includes(p.id):libraryFilter==='unread'?!store.read.includes(p.id):store.read.includes(p.id));html=`<div class="hero"><div><h1>My Library</h1><div class="muted">気になる論文を整理</div></div></div><div class="tabs">${[['saved','★ お気に入り'],['unread','未読'],['read','既読']].map(([v,l])=>`<button class="pill ${libraryFilter===v?'active':''}" data-lib="${v}">${l}</button>`).join('')}</div>${arr.length?arr.map(p=>paperCard(p)).join(''):empty('まだ論文がありません。<br>論文カードの☆を押すと保存できます。')}`}
if(page==='settings'){html=`<div class="hero"><div><h1>設定・データ管理</h1><div class="muted">論文データはこの端末のブラウザに保存されます</div></div></div><div class="settingsbox"><h3>自動更新</h3><p>公開先にある <code>papers.json</code> を起動時に取得します。GitHub Actionsを設定すると毎朝7時頃（日本時間）に候補が更新されます。更新は実行時刻が前後する場合があります。</p><p id="feedInfo">${esc(feedStatus)}</p><button class="secondary" id="refreshFeed">今すぐ確認</button></div><div class="settingsbox"><h3>論文データを追加</h3><p>JSONファイルを読み込んで論文を追加できます。ChatGPTが作成した要約JSONを貼り付けるか、ファイルから読み込めます。同じDOIの論文は要約・新規性などを上書き更新します（既読・お気に入りは保持）。</p><textarea id="pasteJson" rows="6" style="width:100%;padding:12px;border:1px solid #dce4ec;border-radius:10px;font:12px/1.5 monospace" placeholder='{"papers":[{"id":"10.xxxx/...","title":"論文タイトル","category":"Chemistry","url":"https://doi.org/...","summary":"日本語要約","novelty":"新規性"}]}'></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="secondary" id="pasteImport">貼り付けたJSONを取り込む</button><button class="secondary" id="copyPrompt">ChatGPT用の依頼文をコピー</button></div><input class="file" type="file" accept="application/json,.json" id="importFile"><p id="importStatus" role="status"></p></div><div class="settingsbox"><h3>バックアップ</h3><p>論文、既読、お気に入りをJSONで保存できます。</p><button class="secondary" id="exportBtn">JSONを書き出す</button></div><div class="settingsbox"><h3>データの初期化</h3><p>試作品のサンプルデータに戻します。現在の変更は消えます。</p><button class="secondary" id="resetBtn">初期状態に戻す</button></div><div class="notice">自動収集されるのは候補論文の書誌情報です。ChatGPTの要約JSONを手動で取り込めます。自動AI要約と端末間同期は未実装です。未確認情報は未確認と表示します。</div>`}
$('#app').innerHTML=html;$('#nav').innerHTML=[['home','⌂','Home'],['search','⌕','Search'],['library','☆','Library'],['settings','⚙','Settings']].map(([v,i,l])=>`<button class="nav ${page===v?'active':''}" data-nav="${v}"><span class="symbol">${i}</span>${l}</button>`).join('');bind()}
function bind(){if($('#refreshFeed'))$('#refreshFeed').onclick=()=>syncFeed(true);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;query='';render();scrollTo(0,0)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{libraryFilter=b.dataset.lib;render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=b.dataset.save;store.saved=store.saved.includes(id)?store.saved.filter(x=>x!==id):[...store.saved,id];save();render()});if($('#searchInput'))$('#searchInput').oninput=e=>{query=e.target.value;const q=query.toLowerCase();const arr=sorted().filter(p=>[p.title,p.journal,p.firstAuthor,p.firstAffiliation,p.summary,...(p.tags||[])].join(' ').toLowerCase().includes(q));$('#searchResults').innerHTML=arr.length?arr.map(p=>paperCard(p)).join(''):empty('一致する論文がありません。');bindSearchResults()};if($('#exportBtn'))$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paperscope-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const importPapers=data=>{const incoming=Array.isArray(data)?data:data?.papers;if(!Array.isArray(incoming))throw Error('papers配列が必要です');let added=0,updated=0,skipped=0;for(const p of incoming){if(!p||typeof p.id!=='string'||!p.id.trim()){skipped++;continue}const id=p.id.trim().toLowerCase();const existing=store.papers.find(x=>x.id.toLowerCase()===id);if(!existing&&(!p.title||!['Chemistry','Geometry'].includes(p.category)||typeof p.url!=='string'||!p.url.startsWith('https://'))){skipped++;continue}if(existing){const fields=['summary','novelty','firstAuthor','firstAffiliation','corresponding','tags'];let changed=false;for(const field of fields){const value=p[field];if(field==='tags'?Array.isArray(value):typeof value==='string'&&value.trim()!==''){existing[field]=value;changed=true}}if(changed){existing.source='enriched';updated++}else skipped++}else{store.papers.push({...p,tags:Array.isArray(p.tags)?p.tags:[],added:p.added||new Date().toISOString().slice(0,10),source:'enriched'});added++}}save();render();$('#importStatus').textContent=`新規 ${added}件・要約更新 ${updated}件・スキップ ${skipped}件`;return {added,updated,skipped}};
if($('#pasteImport'))$('#pasteImport').onclick=()=>{try{importPapers(JSON.parse($('#pasteJson').value))}catch(err){$('#importStatus').textContent='読み込み失敗：'+err.message}};
if($('#importFile'))$('#importFile').onchange=async e=>{try{importPapers(JSON.parse(await e.target.files[0].text()))}catch(err){$('#importStatus').textContent='読み込み失敗：'+err.message}};
if($('#copyPrompt'))$('#copyPrompt').onclick=()=>{const prompt='PaperScopeに登録する論文の日本語要約を作成してください。対象論文のDOIとタイトルを確認し、可能なら出版社の要旨を読み、研究内容を日本語3〜5文で中立的にまとめ、新規性を1〜2文で説明してください。筆頭著者・所属・責任著者は確認できた場合のみ記載し、推測しないでください。出力はコードブロック内のJSONのみ。形式：{"papers":[{"id":"DOI（https://doi.org/を除いた小文字）","title":"正式タイトル","journal":"雑誌名","date":"YYYY-MM-DD","category":"Chemistry","url":"https://doi.org/DOI","summary":"研究内容","novelty":"新規性","firstAuthor":"氏名または未確認","firstAffiliation":"所属または未確認","corresponding":"氏名・所属または未確認","tags":["Structure"]}]}。既存のPaperScope論文の要約を更新する場合はidを完全一致させてください。';navigator.clipboard.writeText(prompt).then(()=>{$('#importStatus').textContent='ChatGPT用の依頼文をコピーしました。'}).catch(()=>{$('#importStatus').textContent='コピーできませんでした。'})};
if($('#resetBtn'))$('#resetBtn').onclick=()=>{if(confirm('論文データと既読・保存情報を初期化しますか？')){store={papers:seed,read:[],saved:[]};save();render()}}}
function bindSearchResults(){document.querySelectorAll('#searchResults [data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));document.querySelectorAll('#searchResults [data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save;store.saved=store.saved.includes(id)?store.saved.filter(x=>x!==id):[...store.saved,id];save();const f=$('#searchInput');const pos=f.selectionStart;render();$('#searchInput').focus();$('#searchInput').setSelectionRange(pos,pos)})}
function showDetail(id){const p=store.papers.find(p=>p.id===id);if(!p)return;const d=$('#detail');d.classList.remove('hidden');d.innerHTML=`<div class="detailinner"><button class="back" id="backBtn">← 一覧に戻る</button><div class="muted" style="margin-top:25px">${esc(p.journal)} · ${esc(p.date)}</div><h1>${esc(p.title)}</h1><div class="chips">${(p.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><h2>筆頭著者</h2><p>${esc(p.firstAuthor)}<br>${esc(p.firstAffiliation)}</p><h2>Corresponding author</h2><p>${esc(p.corresponding)}</p><h2>研究内容</h2><p>${esc(p.summary)}</p><h2>新規性・重要点</h2><p>${esc(p.novelty)}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:28px 0"><a class="primary" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">論文ページを開く ↗</a><button class="secondary" id="readBtn">${store.read.includes(id)?'✓ 既読を解除':'✓ 既読にする'}</button><button class="secondary" id="detailSave">${store.saved.includes(id)?'★ 保存済み':'☆ 保存する'}</button></div><div class="notice">${p.source==='auto'?'自動収集した書誌情報です。本文の要約・責任著者情報は未検証です。':p.source==='enriched'?'取り込んだ要約です。研究利用の際は原典をご確認ください。':'収録済みのサンプルデータです。研究利用の際は原典をご確認ください。'}</div></div>`;d.scrollTop=0;$('#backBtn').onclick=()=>{d.classList.add('hidden');render()};$('#readBtn').onclick=()=>{store.read=store.read.includes(id)?store.read.filter(x=>x!==id):[...store.read,id];save();showDetail(id)};$('#detailSave').onclick=()=>{store.saved=store.saved.includes(id)?store.saved.filter(x=>x!==id):[...store.saved,id];save();showDetail(id)}}
async function syncFeed(manual=false){
  feedStatus='フィードを確認中…';if(manual)render();
  try{const response=await fetch('./papers.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('フィード未公開（HTTP '+response.status+'）');
    const data=await response.json();if(!data||!Array.isArray(data.papers))throw Error('JSON形式が正しくありません');
    let added=0;for(const p of data.papers){if(!p||typeof p.id!=='string'||typeof p.title!=='string'||!['Chemistry','Geometry'].includes(p.category)||typeof p.url!=='string'||!/^https:\/\//.test(p.url))continue;
      const existing=store.papers.find(x=>x.id.toLowerCase()===p.id.toLowerCase());if(existing){if(p.source==='enriched'){for(const field of ['summary','novelty','firstAuthor','firstAffiliation','corresponding','tags']){if(field==='tags'?Array.isArray(p[field]):typeof p[field]==='string'&&p[field].trim())existing[field]=p[field];}existing.source='enriched';}}else{store.papers.push({...p,source:p.source||'auto',tags:Array.isArray(p.tags)?p.tags:[],added:p.added||p.date||'1970-01-01'});added++}}
    save();lastFeedUpdate=data.updated||'';feedStatus=(added?added+'件の新着を追加 · ':'新着なし · ')+(lastFeedUpdate?'最終取得 '+lastFeedUpdate:'フィード取得済み');
  }catch(e){feedStatus='自動フィード未接続：'+e.message+'。サンプルは利用できます。'}render();
}
render();syncFeed();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
