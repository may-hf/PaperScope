
name: Daily Paper Update

on:
  schedule:
    - cron: '0 22 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-paper-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update paper feed
        run: python update_feed.py

      - name: Commit updated papers
        run: |
          if git diff --quiet -- papers.json; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.json
          git commit -m "Update daily paper feed"
          git push
